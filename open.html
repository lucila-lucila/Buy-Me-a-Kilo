<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14091C" />
    <title>Open your sticker — Buy Me a Kilo</title>
    <meta
      name="description"
      content="Open the sticker you got for filling a kilo of the suitcase. It lives in your browser and nowhere else."
    />
    <!-- Fuera del índice. /open no es una página de contenido: es la entrega de
         algo que se recibe después de pagar. Que esté abierta y sea adivinable
         es una tolerancia para que nadie quede colgado si cierra la pestaña de
         Ko-fi, no una invitación; indexarla la convertiría en la puerta de
         entrada al premio sin pasar por la página. Por eso tampoco está en el
         sitemap. -->
    <meta name="robots" content="noindex, follow" />
    <!-- Canonical sin parámetros igual: /open?sticker=... es la misma página con
         un sticker distinto. -->
    <link rel="canonical" href="https://buymeakilo.com/open" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/bagel-fat-one.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/bag/bag_closed.webp" as="image" type="image/webp" />
    <link rel="prefetch" href="/bag/bag_burst.webp" as="image" />
    <style>
      html,
      body {
        background: #14091c;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/open.tsx"></script>
  </body>
</html>
